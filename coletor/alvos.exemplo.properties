# Lista de alvos do coletor, no formato id=url (uma linha por sistema).
#
# Copie para "alvos.properties" e edite. O .gitignore bloqueia alvos*.properties
# justamente para que a lista real -- que numa instancia privada carrega URL
# interna -- nunca chegue ao repositorio.
#
# Os enderecos abaixo sao servicos publicos de verdade, os mesmos que a
# instancia publica monitora. Subdominio ficticio tipo "portal.example.com"
# parece seguro por ser reservado pela RFC 2606, mas so o dominio raiz tem
# servidor por tras -- os subdominios nao respondem nada.
#
# Rodar:  ./mvnw -q package && java -jar target/sentinela-coletor-0.0.1-SNAPSHOT.jar alvos.properties

portal-servicos=https://github.com
api-integracao=https://api.github.com
agendamento=https://www.wikipedia.org
