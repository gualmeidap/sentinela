# Lista de alvos do coletor, no formato id=url (uma linha por sistema).
#
# Copie para "alvos.properties" e edite. O .gitignore bloqueia alvos*.properties
# justamente para que a lista real -- que numa instancia privada carrega URL
# interna -- nunca chegue ao repositorio.
#
# Rodar:  ./mvnw -q package && java -jar target/sentinela-coletor-0.0.1-SNAPSHOT.jar alvos.properties

portal-servicos=https://portal.example.com
api-integracao=https://api.example.com
agendamento=https://agendamento.example.com
