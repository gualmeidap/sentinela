# So avisos e erros. O coletor ja imprime o resultado da rodada por conta
# propria; o log do SDK aqui e para quando algo der errado -- recusa de
# escrita, tentativa repetida, credencial invalida.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.logFile=System.err
