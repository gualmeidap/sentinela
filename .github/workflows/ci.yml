# Roda os testes a cada push e em cada pull request.
#
# O runner e Linux, enquanto o desenvolvimento acontece no Windows -- e essa
# diferenca e metade do valor do CI: ela pega o que so quebra no outro sistema,
# como caminho de arquivo e quebra de linha. E por isso que o mvnw precisa estar
# versionado com bit de execucao e em LF, garantidos pelo .gitattributes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Chegando commit novo no mesmo branch, a execucao anterior e cancelada: nao
# adianta gastar minuto testando codigo que ja foi substituido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes da API
    runs-on: ubuntu-latest

    # Menor permissao possivel: este job so precisa ler o codigo.
    permissions:
      contents: read

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Instalar o JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          # Guarda o ~/.m2 entre execucoes. Sem isto, cada push baixaria o
          # Spring Boot inteiro de novo.
          cache: maven

      # Sobe o DynamoDB Local pelo mesmo docker-compose.yml usado na maquina de
      # desenvolvimento. Reaproveitar o arquivo evita a divergencia classica:
      # o CI testa contra uma configuracao e o desenvolvedor contra outra.
      #
      # Sem este passo os testes de integracao seriam PULADOS no CI, e o
      # "pula se o banco nao estiver no ar" viraria desculpa para nunca testar.
      - name: Subir o DynamoDB Local
        run: docker compose up -d --wait

      - name: Rodar os testes
        working-directory: api
        run: ./mvnw -B --no-transfer-progress verify

  # Job separado, e nao mais um passo no anterior: as duas pecas sao projetos
  # independentes, e quebrar uma nao deve mascarar o resultado da outra. Rodando
  # em paralelo, o tempo total tambem nao cresce.
  coletor:
    name: Testes do coletor
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Instalar o JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # O coletor tambem grava no DynamoDB desde o passo 4, entao ele precisa
      # do banco tanto quanto a API. Sem este passo, os testes de integracao
      # daqui seriam pulados em silencio e o job ficaria verde sem te-los
      # executado.
      - name: Subir o DynamoDB Local
        run: docker compose up -d --wait

      - name: Rodar os testes
        working-directory: coletor
        run: ./mvnw -B --no-transfer-progress verify

  pagina:
    name: Testes da pagina
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Instalar o JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # O modulo pagina/ nao versiona seus proprios recursos: eles sao uma
      # copia gerada de web/, feita por este script (que tambem troca o
      # endereco da API quando ha um real para colocar). Sem argumento, so
      # copia como esta -- o suficiente para testar o handler.
      - name: Preparar os recursos estaticos
        run: python3 infra/preparar_pagina.py

      - name: Rodar os testes
        working-directory: pagina
        run: ./mvnw -B --no-transfer-progress verify
