spring:
  application:
    name: sentinela-api
  profiles:
    # O perfil local liga o semeador de dados sinteticos. Um deploy real
    # sobrescreve isto com SPRING_PROFILES_ACTIVE e nao semeia nada.
    active: local
  jackson:
    deserialization:
      # Campo que a API nao conhece derruba a requisicao em vez de ser
      # ignorado em silencio. Se um publicador mandar "usuario" ou "email"
      # junto, ele descobre na hora -- em vez de o campo ser descartado sem
      # que ninguem corrija a origem.
      fail-on-unknown-properties: true

server:
  port: 8080
  error:
    # Erro nunca devolve mensagem de excecao nem pilha: e por ai que caminho
    # interno e nome de usuario vazam para fora.
    include-message: never
    include-stacktrace: never
    include-exception: false

sentinela:
  # Origens autorizadas a ler a API pelo navegador. Lista fechada de proposito:
  # "*" deixaria qualquer pagina aberta no navegador ler o painel interno.
  # 5500 e a porta do servidor estatico local que serve a pasta web/.
  origens-permitidas:
    - http://localhost:5500
    - http://127.0.0.1:5500

  # Fuso em que o "hoje" da contagem de eventos e calculado.
  fuso-horario: America/Sao_Paulo

  # Sistemas autorizados a publicar em POST /eventos.
  #
  # A chave de verdade vem da variavel de ambiente. O valor apos os dois
  # pontos e so o padrao da demonstracao publica, que monitora alvo ficticio
  # e nao guarda nada sensivel -- numa instancia real, a variavel e
  # obrigatoria e a chave nunca aparece em arquivo versionado.
  aplicacoes:
    - id: portal-servicos
      chave: ${SENTINELA_CHAVE_PORTAL_SERVICOS:chave-de-demonstracao-trocar-em-producao}
      limite-por-hora: 500
      tipos:
        - senha.redefinida
        - conta.desbloqueada
      motivos:
        - dependencia_indisponivel
        - credencial_invalida
        - tempo_esgotado
      chaves-de-contexto:
        - campus
        - canal
