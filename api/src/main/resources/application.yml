spring:
  application:
    name: sentinela-api
  profiles:
    # O perfil local liga o semeador de dados sinteticos. Um deploy real
    # sobrescreve isto com SPRING_PROFILES_ACTIVE e nao semeia nada.
    active: local
  jackson:
    deserialization:
      # Campo que a API nao conhece derruba a requisicao em vez de ser
      # ignorado em silencio. Se um publicador mandar "usuario" ou "email"
      # junto, ele descobre na hora -- em vez de o campo ser descartado sem
      # que ninguem corrija a origem.
      fail-on-unknown-properties: true

server:
  port: 8080
  error:
    # Erro nunca devolve mensagem de excecao nem pilha: e por ai que caminho
    # interno e nome de usuario vazam para fora.
    include-message: never
    include-stacktrace: never
    include-exception: false

sentinela:
  # Origens autorizadas a ler a API pelo navegador. Lista fechada de proposito:
  # "*" deixaria qualquer pagina aberta no navegador ler o painel interno.
  # 5500 e a porta do servidor estatico local que serve a pasta web/.
  origens-permitidas:
    - http://localhost:5500
    - http://127.0.0.1:5500

  # Fuso em que o "hoje" da contagem de eventos e calculado.
  fuso-horario: America/Sao_Paulo

  # Os sistemas que a API conhece. Estar aqui e pre-requisito para aparecer no
  # painel -- tanto para disponibilidade quanto para eventos.
  #
  # A "url" e opcional e serve so para a tela mostrar o que esta sendo
  # monitorado. Quem de fato verifica o alvo e o coletor, que recebe os
  # enderecos por variavel de ambiente e nao le este arquivo. Numa instancia
  # privada a url fica de fora: endereco interno nao vai para uma tela publica.
  #
  # Os alvos abaixo sao servicos publicos de verdade. A instancia publica e
  # demonstracao, e medir servico real da um diferencial sobre alvo ficticio: o
  # painel mostra disponibilidade e tempo de resposta medidos, e nao numero que
  # nunca foi checado. Subdominio de example.com pareceria mais seguro por ser
  # ficticio, mas so o dominio raiz e reservado pela RFC 2606 -- os subdominios
  # nao tem servidor nenhum atras, o que so apareceu ao ligar o coletor de
  # verdade contra a AWS.
  sistemas:
    - id: portal-servicos
      nome: Portal de Servicos
      url: https://github.com
    - id: api-integracao
      nome: API de Integracao
      url: https://api.github.com
    - id: agendamento
      nome: Agendamento Online
      url: https://www.wikipedia.org

  # Sistemas autorizados a publicar em POST /eventos.
  #
  # A chave de verdade vem da variavel de ambiente. O valor apos os dois
  # pontos e so o padrao da demonstracao publica, que monitora alvo ficticio
  # e nao guarda nada sensivel -- numa instancia real, a variavel e
  # obrigatoria e a chave nunca aparece em arquivo versionado.
  aplicacoes:
    - id: portal-servicos
      chave: ${SENTINELA_CHAVE_PORTAL_SERVICOS:chave-de-demonstracao-trocar-em-producao}
      limite-por-hora: 500
      tipos:
        - senha.redefinida
        - conta.desbloqueada
      motivos:
        - dependencia_indisponivel
        - credencial_invalida
        - tempo_esgotado
      chaves-de-contexto:
        - campus
        - canal

  # Acesso ao DynamoDB. Só entra em uso com o perfil "dynamo" ativo.
  dynamo:
    # Vazio = DynamoDB de verdade, na regiao configurada. Preenchido = aponta
    # para outro endereco, que localmente e o DynamoDB Local do docker-compose.
    endpoint: ${SENTINELA_DYNAMO_ENDPOINT:}
    regiao: ${AWS_REGION:us-east-1}
    tabela-verificacoes: sentinela-verificacoes
    tabela-eventos: sentinela-eventos
    retencao-dias: 30
    # Criar tabela na subida e conveniencia de ambiente local. Na AWS a tabela
    # e criada uma vez por infraestrutura, e a aplicacao nao deve ter permissao
    # para criar nada.
    criar-tabelas: ${SENTINELA_DYNAMO_CRIAR_TABELAS:false}
